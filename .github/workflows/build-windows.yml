# Builds LDmicro for Windows (32 bits, English and Spanish) with Visual Studio 2022,
# and publishes a zip with the executables, the helper scripts and LIBRARIES_FOR.
name: Build Windows

on:
  push:
    branches: [ master, fix/errores-revision ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build (EN and ES)
        shell: pwsh
        run: |
          perl --version | Select-Object -First 2
          cmake --version
          foreach ($lang in "EN", "ES") {
            cmake -S ldmicro -B "ldmicro/build-$lang" -G "Visual Studio 17 2022" -A Win32 "-DLDLANG=$lang" -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
            if ($LASTEXITCODE -ne 0) { throw "CMake configure failed ($lang)" }
            cmake --build "ldmicro/build-$lang" --config Release --parallel
            if ($LASTEXITCODE -ne 0) { throw "Build failed ($lang)" }
          }
          Get-ChildItem -Recurse ldmicro/build-EN, ldmicro/build-ES -Filter *.exe | Select-Object FullName, Length

      - name: Package
        shell: pwsh
        run: |
          $out = "LDmicro-win32"
          New-Item -ItemType Directory -Force $out | Out-Null
          $en = Get-ChildItem -Recurse ldmicro/build-EN -Filter ldmicro.exe | Select-Object -First 1
          $es = Get-ChildItem -Recurse ldmicro/build-ES -Filter ldmicro-es.exe | Select-Object -First 1
          if (-not $en -or -not $es) { throw "Executables not found" }
          Copy-Item -Recurse -Force (Join-Path $en.DirectoryName "*") $out
          Copy-Item -Force $es.FullName $out
          Get-ChildItem $out | Format-Table Name, Length
          if (-not (Test-Path "$out/ldmicro.exe")) { throw "ldmicro.exe not built" }
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LDmicro-win32
          path: LDmicro-win32/

      - name: Publish pre-release of the branch
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" LDmicro-win32.zip --prerelease --target "$GITHUB_SHA" \
            --title "LDmicro Windows build ($GITHUB_REF_NAME)" \
            --notes "Automatic build of ${GITHUB_SHA::7}. Unzip and run ldmicro.exe (English) or ldmicro-es.exe (Spanish). Not tested on hardware."
